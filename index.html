h2{margin:0;font-size:18px}
.hg{background:var(--ac);color:#fff;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}

.hrow{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;color:inherit;cursor:pointer;padding:0}

.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.mu{color:var(--mu);font-size:13px}

.mid{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}

.bp{background:var(--ac);color:#fff}
.bs{background:#fff;color:var(--tx);border:1px solid var(--bd2)}
.bl{background:var(--acl);color:var(--ac)}
.bw{background:#fff;color:var(--wa);border:1px solid var(--bd2)}
.badge{font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap}
.bok{color:var(--ac);background:var(--acl)}
.bwa{color:var(--wa);background:var(--wal)}
.bgr{color:var(--mu);background:#EEF1EF}
.ctag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border:1px solid;border-radius:999px;padding:2px 8px;background:#fff;white-space:nowrap}
.ctag i{width:8px;height:8px;border-radius:4px;display:inline-block}
.warn{background:var(--wal);border:1px solid var(--wab);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--wa2);font-size:14px}
.ok{background:var(--acl);border:1px solid var(--acb);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ac2);font-size:14px}
.av{width:40px;height:40px;border-radius:20px;background:var(--acl);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.tabs{display:grid;gap:6px;background:#EEF1EF;padding:4px;border-radius:12px}
.tab{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--mu);font:500 14px Inter,sans-serif;cursor:pointer}
.tab.on{background:#fff;color:var(--ac);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sec{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:0}
.step{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:4px}
.sb{width:40px;height:40px;border:0;border-radius:8px;font:600 20px Inter,sans-serif;cursor:pointer}
input,select{min-height:48px;border:1px solid var(--bd2);border-radius:12px;padding:0 14px;font:500 16px Inter,sans-serif;background:#fff;color:var(--tx);width:100%}
label{font-size:13px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
nav{height:68px;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 12px Inter,sans-serif;color:var(--mu);cursor:pointer}
nav button.on{color:var(--ac);font-weight:600}
.short{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 13px Inter,sans-serif;color:var(--tx);cursor:pointer}
.ic{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
svg{flex-shrink:0}
.demo{font-size:11px;text-align:center;color:var(--mu);padding:6px 0 0}
</style>
</head>

function dataLonga(){var d=D(HOJE);return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getUTCDay()]+', '+d.getUTCDate()+' de '+mesAtual();}

function nk(x){return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}

function canon(n){var k=Object.keys(GEO).filter(function(x){return nk(x)===nk(n);})[0];return k||n.trim();}
function km(a,b){var R6=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R6*Math.asin(Math.sqrt(h));}
function fkm(d){return d<1?Math.round(d*1000)+' m':d.toFixed(1).replace('.',',')+' km';}

function consV(){return S.cons.filter(inP);}

 cxForm:function(){S.cx.form=true;S.cx.praca=pracaAtual();S.cx.cat='';S.cx.valor='';S.cx.desc='';S.cx.erro='';render();},
 cxPick:function(d){keep();S.cx.cat=d.v;S.cx.erro='';render();},
 cxCancel:function(){S.cx.form=false;render();},
 cxSave:function(){var c=S.cx,v=num(c.valor);
  if(!c.cat){keep();c.erro='Escolha o tipo de despesa.';render();return;}
  if(v<=0){keep();c.erro='Informe o valor.';render();return;}
  if(c.cat==='Outros'&&!c.desc.trim()){keep();c.erro='Descreva a despesa em Observação.';render();return;}
  c.lista.unshift({praca:S.praca==='todas'?c.praca:S.praca,dt:HOJE,ent:false,d:c.cat+(c.desc.trim()?' · '+c.desc.trim():''),cat:c.cat,f:'Pix',v:v});c.form=false;c.valor='';c.desc='';c.erro='';render();},
 cmAba:function(d){S.cm.aba=d.v;render();},
 cmPagar:function(d){keep();var v=S.cm.vend[+d.i];v.pago=true;S.cx.lista.unshift({praca:v.praca,dt:HOJE,ent:false,d:'Comissão paga · '+v.c,cat:'Comissão paga',f:'Pix',v:r2(v.base*0.2)});render();}
};
var IN={
 acPago:function(el){S.ac.pagoTexto=el.value;var k=calc(),s=document.getElementById('acSaldo');s.textContent=fmt(k.saldo);s.style.color=k.saldo>0?'var(--wa)':'var(--ac)';document.getElementById('acCv').textContent=fmt(k.cv);},
 neCons:function(el){startNE(el.value);render();},
 neDt:function(el){var v=el.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v>HOJE)return;S.ne.dataEnt=v;S.ne.data=sugere(addD(v,60));keep();render();},
 trocaPraca:function(el){S.praca=el.value;render();},
 nvPraca:function(el){S.novo.praca=el.value;S.novo.cidade=PR(el.value).cidades[0].nome;render();},
 cxPraca:function(el){S.cx.praca=el.value;},
 npF:function(el){S.np[el.getAttribute('data-f')]=el.value;},
 avF:function(el){S.av.outra=el.value;},
 suF:function(el){S.setup[el.getAttribute('data-f')]=el.value;},
 lgF:function(el){S.lg[el.getAttribute('data-f')]=el.value;},
 vfF:function(el){S.vf[el.getAttribute('data-f')]=el.value;if(el.tagName==='SELECT')render();},
 neRef:function(el){S.ne.ref=el.value;},
 cxVal:function(el){S.cx.valor=el.value;},
 cxDesc:function(el){S.cx.desc=el.value;},
 pfF:function(el){S.pf[el.getAttribute('data-f')]=el.value;},
 nvF:function(el){var k=el.getAttribute('data-f'),v=el.value,d;
  if(k==='cep'){v=cepFmt(v);el.value=v;S.novo.cep=v;if(v.length===9&&!(S.novo.geo&&S.novo.geo.busy))A.cepBuscar();return;}
  if(k==='cpf'){d=v.replace(/\D/g,'').slice(0,11);v=d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2');el.value=v;}
  if(k==='tel'){d=v.replace(/\D/g,'').slice(0,11);v=d.length>10?d.replace(/^(\d{2})(\d)(\d{4})(\d{0,4})/,'($1) $2 $3-$4'):d.replace(/^(\d{2})(\d{0,4})(\d{0,4})/,function(m,a,b,c){return '('+a+') '+b+(c?'-'+c:'');});el.value=v;}
  S.novo[k]=v;}
};
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var f=A[b.getAttribute('data-act')];if(f)f(b.dataset);});
app.addEventListener('input',function(e){var k=e.target.getAttribute('data-in');if(k&&IN[k]&&e.target.tagName==='INPUT')IN[k](e.target);});
app.addEventListener('change',function(e){if(e.target.id==='bk-file'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){var d=null;try{d=JSON.parse(fr.result);}catch(x){}S.bk=valido(d)?{pend:d}:{msg:'Esse arquivo não é um backup válido do Rota Consultora.',erro:true};render();};fr.readAsText(e.target.files[0]);return;}var k=e.target.getAttribute('data-in');if(k&&IN[k]&&e.target.tagName==='SELECT')IN[k](e.target);});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ref')A.neAdd();if(e.key==='Enter'&&(e.target.id==='lg-u'||e.target.id==='lg-s'))A.entrar();if(e.key==='Enter'&&e.target.id==='np-p')A.npSug();if(e.key==='Enter'&&e.target.id==='np-o')A.npAdd();});
render();
})();
</script>
